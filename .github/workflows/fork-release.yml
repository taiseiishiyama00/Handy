name: "Fork Release (Windows)"

# Builds an unsigned Windows installer for this fork and attaches it to a
# release. release.yml needs the upstream signing secrets; tauri.fork.conf.json
# drops code signing and updater artifacts, and points the updater at this fork
# so the official release does not replace the fork's build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.8-ja.1"
        required: true
        type: string

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ inputs.tag }}",
              target_commitish: context.sha,
              name: "${{ inputs.tag }}",
              draft: true,
              prerelease: false,
              generate_release_notes: false
            })
            return data.id

  publish-windows:
    permissions:
      contents: write
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: "--bundles nsis --config src-tauri/tauri.fork.conf.json"
      sign-binaries: false
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      no-cache: true
    secrets: inherit
